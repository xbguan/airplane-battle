<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>飞机大战 V2.2</title>
  <style>
    :root {
      --ink: #294f68;
      --sky: #8eddf6;
      --grass: #83cd73;
      --sun: #ffd76a;
      --danger: #ef725d;
      --magic: #7444c8;
      --panel: #173a58;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      background: radial-gradient(circle at 50% 10%, #effcff, #bde8f6 45%, #79b9d2);
      font-family: "Arial Rounded MT Bold", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    button { font: inherit; }
    button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
    #game-shell {
      position: relative;
      width: min(100vw, 177.7778vh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--sky);
      border-radius: 1.4vw;
      box-shadow: 0 22px 62px rgba(29, 75, 104, .3);
      cursor: crosshair;
    }
    #game-canvas { display: block; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    #hud {
      position: absolute;
      inset: 2.2% 1.7% auto;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .55vw;
      pointer-events: none;
    }
    .hud-chip {
      min-height: 2.5vw;
      display: flex;
      align-items: center;
      gap: .55vw;
      padding: .36vw .62vw;
      border: .11vw solid #bfe9f4;
      border-radius: .86vw;
      color: #ecfbff;
      background: linear-gradient(145deg, #315f7d, #173a58 58%, #102d49);
      box-shadow: 0 .22vw 0 #09243b, inset 0 .11vw 0 rgba(255,255,255,.22), 0 .38vw .7vw rgba(15, 42, 67, .28);
      font-size: clamp(10px, .96vw, 18px);
      font-weight: 900;
      white-space: nowrap;
    }
    #hud > .hud-chip:nth-child(2) { position: absolute; left: 50%; transform: translateX(-50%); }
    .hud-icon { position: relative; width: 1.1em; height: 1.1em; flex: 0 0 1.1em; border: .12em solid #d8fbff; background: #40bde0; box-shadow: inset .12em .12em 0 #aaf4ff, .08em .1em 0 #0d2b45; }
    .hull-icon { border-radius: 35% 35% 45% 45%; background: linear-gradient(#ffb1a2,#e75262); }
    .mission-icon { overflow: visible; border-radius: 50%; border-color: #ffe985; background: radial-gradient(circle, #fff 0 14%, #173a58 15% 28%, #ffcf46 29% 52%, #d95a4d 53% 100%); }
    .mission-icon::before, .mission-icon::after { content: ''; position: absolute; left: 50%; top: 50%; background: #ffe985; transform: translate(-50%, -50%); }
    .mission-icon::before { width: 1.5em; height: .12em; }
    .mission-icon::after { width: .12em; height: 1.5em; }
    .xp-icon { clip-path: polygon(50% 0, 61% 34%, 100% 36%, 69% 58%, 80% 100%, 50% 75%, 20% 100%, 31% 58%, 0 36%, 39% 34%); background: #ffd14d; }
    .hud-copy { display: grid; gap: .16vw; text-align: left; }
    .hud-copy small { color: #b9e4ee; font-size: .62em; line-height: 1; letter-spacing: .08em; }
    .hud-value { min-width: 2.2em; text-align: right; }
    .mission-chip { min-width: 8.8vw; justify-content: center; border-color: #f6d66a; background: linear-gradient(145deg, #3d6780, #244d69); }
    .mission-chip .hud-copy { text-align: center; }
    .mission-chip strong { color: #ffe67a; font-size: 1.08em; text-shadow: 0 .08em #a45d24; }
    .meter {
      width: 7.6vw;
      height: .62vw;
      min-height: 7px;
      overflow: hidden;
      border-radius: 99px;
      border: 1px solid #0c2842;
      background: #0d2f49;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.48);
    }
    .meter > i { display: block; height: 100%; border-radius: inherit; transition: width .18s ease; }
    #hp-fill { background: linear-gradient(#ff9486, #ef3653); box-shadow: inset 0 2px #ffd0c9; }
    #xp-fill { background: linear-gradient(#fff176, #f1aa20); box-shadow: inset 0 2px #fff8bf; }
    #upgrade-attack {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 2.6%;
      transform: translateX(-50%);
      pointer-events: auto;
      border: .15vw solid #fff3c3;
      animation: bob 1s ease-in-out infinite;
      color: #fff;
      background: linear-gradient(#ffbd52, #ed7b35);
      box-shadow: 0 .32vw 0 #ae552a, 0 .58vw .9vw rgba(113, 75, 31, .22);
      text-shadow: 0 1px #9a4924;
      cursor: pointer;
      min-height: 0;
      gap: .5vw;
      padding: .35vw .72vw;
      font-size: clamp(11px, .82vw, 15px);
    }
    #upgrade-attack .weapon-asset { width: clamp(34px, 2.5vw, 46px); height: clamp(34px, 2.5vw, 46px); margin: 0; flex: 0 0 auto; }
    #upgrade-attack:disabled { opacity: .95; animation: none; cursor: default; }
    #boss-panel {
      position: absolute;
      z-index: 5;
      top: 8.8%;
      left: 50%;
      width: 43%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      font-size: clamp(12px, 1.1vw, 20px);
      font-weight: 900;
      text-shadow: 0 2px 4px #0d224d;
      pointer-events: none;
    }
    .boss-meter { height: 1.15vw; min-height: 10px; margin-top: .35vw; padding: .15vw; border-radius: 99px; background: #4e7184; border: .12vw solid #fffdf0; box-shadow: 0 .22vw 0 #35566a; }
    #boss-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffdd4e, #ff634e); transition: width .12s linear; }
    #fragments {
      position: absolute;
      z-index: 6;
      left: 1.6%;
      bottom: 2.6%;
      display: flex;
      gap: .55vw;
    }
    .fragment-button, .weapon-button {
      border: .15vw solid rgba(255,255,255,.9);
      color: #47657a;
      background: linear-gradient(145deg, #fffef4, #e7f1e8);
      box-shadow: 0 .22vw 0 #83a4ad, 0 .45vw .75vw rgba(36, 80, 95, .18);
      cursor: pointer;
    }
    .fragment-button { min-width: 8.2vw; display: flex; align-items: center; gap: .34vw; padding: .34vw .54vw; border-radius: .85vw; font-family: ui-monospace, "SFMono-Regular", "Microsoft YaHei", monospace; font-size: clamp(9px, .76vw, 14px); font-weight: 900; letter-spacing: 0; text-shadow: none; }
    .fragment-button > img { width: clamp(20px, 1.55vw, 28px); height: clamp(20px, 1.55vw, 28px); object-fit: contain; image-rendering: pixelated; }
    .fragment-count { margin-left: auto; color: #31546e; }
    .fragment-button.ready { color: #7c4823; background: linear-gradient(#ffe78d, #ffb54d); animation: bob 1s ease-in-out infinite; }
    #weapons { position: absolute; z-index: 6; right: 1.6%; bottom: 2.6%; display: flex; gap: .65vw; }
    .weapon-button {
      width: 4.8vw;
      min-width: 50px;
      aspect-ratio: 1;
      border-radius: 1vw;
      color: #47657a;
      background: linear-gradient(145deg, #fffef4, #e7f1e8);
      box-shadow: 0 .22vw 0 #83a4ad, 0 .45vw .75vw rgba(36, 80, 95, .18);
      font-size: clamp(18px, 1.7vw, 32px);
      font-weight: 900;
    }
    .weapon-button small { display: block; font-size: .62em; }
    .weapon-asset { display: block; width: 65%; height: 65%; margin: .12em auto -.08em; object-fit: contain; image-rendering: pixelated; }
    .missile-icon {
      position: relative;
      display: block;
      width: 1.05em;
      height: 1.55em;
      margin: 0 auto .05em;
      border: .09em solid #285e9f;
      border-radius: 70% 70% 32% 32%;
      background: linear-gradient(90deg, #7ecbea, #fff 48%, #4a97cf);
      transform: rotate(38deg);
      box-shadow: 0 .1em .2em rgba(0,0,0,.25);
    }
    .missile-icon::before {
      content: '';
      position: absolute;
      left: -.35em;
      right: -.35em;
      bottom: .08em;
      height: .48em;
      clip-path: polygon(0 100%, 24% 0, 76% 0, 100% 100%, 65% 72%, 35% 72%);
      background: #ef4d5a;
    }
    .missile-icon::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -.48em;
      width: .34em;
      height: .52em;
      transform: translateX(-50%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: #ffd341;
    }
    .weapon-button.locked { filter: grayscale(.7); opacity: .72; cursor: default; }
    .weapon-button.active { transform: translateY(-.32vw); outline: .22vw solid var(--sun); background: linear-gradient(145deg, #fff3b4, #f3c85a); }
    .base-weapon { display: grid; place-items: center; width: 4.8vw; min-width: 50px; aspect-ratio: 1; border: .15vw solid #fff; border-radius: 1vw; color: #9b542c; background: linear-gradient(145deg, #fff2c7, #ffc966); box-shadow: 0 .22vw 0 #d48a40, 0 .45vw .75vw rgba(83, 62, 31, .18); font-size: clamp(18px, 1.7vw, 32px); }
    .screen, #upgrade-modal {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 4vw;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, rgba(245, 253, 255, .72), rgba(57, 112, 139, .53));
      backdrop-filter: blur(5px);
    }
    .panel {
      width: min(650px, 64vw);
      padding: clamp(22px, 3vw, 46px);
      border: clamp(3px, .35vw, 7px) solid #a9ebf5;
      border-radius: clamp(24px, 2.4vw, 46px);
      color: #effbff;
      background: linear-gradient(155deg, #315f7d, #183b59 58%, #102d49);
      box-shadow: 0 .62vw 0 #09243b, inset 0 .16vw 0 rgba(255,255,255,.2), 0 1.4vw 4vw rgba(8, 32, 56, .38);
    }
    .eyebrow { margin: 0 0 .6rem; color: #b7eefa; font-size: clamp(12px, 1vw, 18px); font-weight: 900; letter-spacing: .14em; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: .7rem; font-size: clamp(38px, 6vw, 90px); line-height: .9; letter-spacing: -.06em; color: #fff6b0; text-shadow: 0 .07em #d2802b, 0 .13em #0b2944; }
    h2 { color: #fff6b0; font-size: clamp(24px, 3vw, 46px); text-shadow: 0 .08em #0b2944; }
    .lead { max-width: 31rem; margin: 0 auto 1.4rem; color: #d8f4f8; font-size: clamp(13px, 1.2vw, 20px); line-height: 1.65; }
    .primary, .secondary {
      min-width: 9rem;
      padding: .8em 1.4em;
      border: 3px solid #fff;
      border-radius: 999px;
      font-size: clamp(16px, 1.3vw, 23px);
      font-weight: 900;
      cursor: pointer;
    }
    .primary { color: #fff; background: linear-gradient(#ffbd52, #ed7b35); box-shadow: 0 .38em 0 #ae552a; text-shadow: 0 1px #9a4924; }
    .secondary { color: #fff; background: linear-gradient(#82a6ad, #547b89); box-shadow: 0 .38em 0 #365968; }
    .button-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    .scene-choices { display: flex; justify-content: center; gap: .7rem; margin: 0 auto 1.35rem; }
    .scene-choice { width: min(13rem, 24vw); padding: .45rem .55rem; border: 3px solid #85c8dc; border-radius: 1rem; color: #eafaff; background: #174360; box-shadow: 0 .26rem 0 #092943, inset 0 2px rgba(255,255,255,.15); cursor: pointer; font-weight: 900; }
    .scene-choice::before { content: ''; display: block; height: 2.7rem; margin-bottom: .35rem; border-radius: .5rem; background: url('assets/scenery/scene-preview-topdown.png') center / cover no-repeat; }
    .scene-choice[data-scene-theme="backgroundPerspective"]::before { background-image: url('assets/scenery/scene-preview-perspective.png'); }
    .scene-choice.selected { border-color: #ffe76e; color: #fff5b0; transform: translateY(-.14rem); }
    .version { position: absolute; right: 1.5%; top: 1.6%; z-index: 12; color: rgba(255,255,255,.82); font-size: clamp(10px, .85vw, 16px); font-weight: 900; pointer-events: none; }
    #toast { position: absolute; z-index: 8; left: 50%; top: 18%; transform: translate(-50%, -20px); padding: .7vw 1.2vw; border: 3px solid #fff; border-radius: 99px; color: #fff; background: #294d82e8; font-weight: 900; opacity: 0; transition: .2s ease; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .panel { width: min(500px, 48vw); padding: clamp(18px, 2.1vw, 32px); }
    .pixel-copy, .panel h1, .panel h2, .panel button, .weapon-button, #upgrade-attack { font-family: ui-monospace, "SFMono-Regular", "Microsoft YaHei", monospace; letter-spacing: .04em; text-shadow: 1px 1px 0 #0b2944, 2px 2px 0 rgba(7,29,48,.62); }
    .panel-version { margin: -.16rem 0 .54rem; color: #9eeefe; font-size: clamp(9px, .78vw, 13px); font-weight: 900; }
    .modal-fighter { display: block; width: clamp(70px, 7.2vw, 118px); height: auto; margin: 0 auto .42rem; filter: drop-shadow(0 9px 5px rgba(5,29,50,.48)); image-rendering: pixelated; animation: takeoff 2.5s ease-in-out infinite; }
    .screen .panel {
      position: relative;
      width: min(720px, 68vw);
      padding: clamp(18px, 2vw, 30px);
      border: clamp(5px, .42vw, 7px) solid #08263f;
      border-radius: 0;
      clip-path: polygon(22px 0, calc(100% - 22px) 0, calc(100% - 22px) 7px, calc(100% - 7px) 7px, calc(100% - 7px) 22px, 100% 22px, 100% calc(100% - 22px), calc(100% - 7px) calc(100% - 22px), calc(100% - 7px) calc(100% - 7px), calc(100% - 22px) calc(100% - 7px), calc(100% - 22px) 100%, 22px 100%, 22px calc(100% - 7px), 7px calc(100% - 7px), 7px calc(100% - 22px), 0 calc(100% - 22px), 0 22px, 7px 22px, 7px 7px, 22px 7px);
      background: linear-gradient(180deg, #3b7898 0 8px, #285d7d 8px 18px, #17415f 18px 72%, #102f4d 72%);
      box-shadow: inset 0 0 0 3px #71cce1, inset 0 8px 0 rgba(206, 249, 255, .28), inset 0 -9px 0 #0a2944;
      filter: drop-shadow(0 9px 0 #061c31) drop-shadow(0 17px 18px rgba(6, 28, 49, .4));
    }
    .screen .panel h1 { margin-bottom: .42rem; font-size: clamp(34px, 4.6vw, 66px); }
    .screen .panel h2 { margin-bottom: .5rem; }
    .screen .lead { max-width: 38rem; margin-bottom: 1rem; font-size: clamp(12px, 1vw, 17px); line-height: 1.5; }
    .screen .primary {
      border: 4px solid #562c1d;
      border-radius: 3px;
      color: #fffbd5;
      background: linear-gradient(180deg, #ffe36b 0 14%, #ffb43f 14% 55%, #ed762f 55% 100%);
      box-shadow: inset 0 4px 0 #fff4a9, inset 0 -5px 0 #bc4d25, 0 7px 0 #692f22;
    }
    #start-screen .modal-fighter { width: clamp(58px, 5.8vw, 88px); margin-bottom: .2rem; }
    #start-screen .eyebrow { margin-bottom: .3rem; }
    #start-screen .panel-version { margin-bottom: .35rem; }
    #game-over .panel { width: min(570px, 56vw); padding-block: clamp(16px, 1.5vw, 23px); }
    #game-over .modal-fighter { width: clamp(58px, 5.8vw, 88px); margin-bottom: .2rem; }
    #game-over .eyebrow, #game-over .panel-version { margin-bottom: .3rem; }
    #game-over h2 { font-size: clamp(22px, 2.5vw, 38px); }
    .screen .scene-choices { gap: .85rem; margin-bottom: 1rem; }
    .screen .scene-choice {
      width: min(15rem, 25vw);
      padding: .45rem;
      border: 4px solid #0a2b46;
      border-radius: 2px;
      background: #123854;
      box-shadow: inset 0 0 0 2px #5fb7d2, 0 5px 0 #071e34;
    }
    .screen .scene-choice::before { aspect-ratio: 16 / 9; height: auto; border: 2px solid #081f34; border-radius: 0; }
    .screen .scene-choice.selected { border-color: #ffe36c; box-shadow: inset 0 0 0 2px #fff09a, 0 5px 0 #9c5b20, 0 0 0 2px #6b3d1e; }
    .screen .scene-choice:focus-visible { outline: 4px solid #fff4a0; outline-offset: 4px; }
    .scene-name, .scene-view { display: block; }
    .scene-name { color: #f5fcff; font-size: clamp(12px, 1vw, 16px); }
    .scene-view { margin-top: .12rem; color: #9edce9; font-size: clamp(9px, .7vw, 11px); letter-spacing: .12em; }
    .scene-choice.selected .scene-name { color: #fff4a0; }
    .scene-choice.selected .scene-view { color: #ffe170; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; max-width: 30rem; margin: .7rem auto 1.15rem; }
    .result-stat { padding: .55rem .35rem; border: 3px solid #0b2b47; color: #a9e8f3; background: #123a58; box-shadow: inset 0 3px 0 #397a98, 0 4px 0 #071f35; font-size: clamp(10px, .85vw, 14px); font-weight: 900; }
    .result-stat strong { display: block; margin-top: .2rem; color: #ffe36c; font-size: clamp(18px, 1.7vw, 26px); }
    @keyframes bob { 50% { translate: 0 -.25vw; filter: brightness(1.06); } }
    @keyframes takeoff { 50% { transform: translateY(-8px) rotate(-1deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main id="game-shell" aria-label="飞机大战游戏区域">
  <canvas id="game-canvas" width="1280" height="720"></canvas>

  <section id="hud" class="hidden" aria-label="游戏状态">
    <div class="hud-chip"><span class="hud-icon hull-icon" aria-hidden="true"></span><span class="hud-copy"><small>战机耐久</small><span class="meter"><i id="hp-fill"></i></span></span><span id="hp-text" class="hud-value">100</span></div>
    <div class="hud-chip mission-chip"><span class="hud-icon mission-icon" aria-hidden="true"></span><span class="hud-copy"><small>本轮进度</small><strong id="kill-text">0/10</strong></span></div>
    <div class="hud-chip"><span class="hud-icon xp-icon" aria-hidden="true"></span><span class="hud-copy"><small>作战经验</small><span class="meter"><i id="xp-fill"></i></span></span><span id="xp-text" class="hud-value">0</span></div>
  </section>

  <button id="upgrade-attack" class="hud-chip hidden" disabled><img class="weapon-asset" src="assets/weapons/ui-attack-upgrade.png" alt=""><span id="attack-upgrade-copy">攻击升级·50</span></button>

  <section id="boss-panel" class="hidden" aria-label="BOSS 生命值">
    <span id="boss-name">BOSS</span>
    <div class="boss-meter"><div id="boss-fill"></div></div>
  </section>

  <section id="fragments" class="hidden" aria-label="飞机碎片">
    <button id="homing-fragment" class="fragment-button"><img src="assets/weapons/ui-homing-missile.png" alt=""><span>追踪碎片</span><span class="fragment-count">0/5</span></button>
    <button id="laser-fragment" class="fragment-button"><img src="assets/weapons/ui-laser-cannon.png" alt=""><span>激光碎片</span><span class="fragment-count">0/5</span></button>
  </section>

  <section id="weapons" class="hidden" aria-label="特殊武器">
    <span id="base-weapon" class="base-weapon" aria-label="双列机枪"><img class="weapon-asset" src="assets/weapons/ui-machinegun.png" alt=""></span>
    <button id="homing-weapon" class="weapon-button locked" aria-label="切换追踪导弹"><img class="weapon-asset" src="assets/weapons/ui-homing-missile.png" alt=""><small>Lv.0</small></button>
    <button id="laser-weapon" class="weapon-button locked" aria-label="切换激光"><img class="weapon-asset" src="assets/weapons/ui-laser-cannon.png" alt=""><small>Lv.0</small></button>
  </section>

  <div id="toast" role="status"></div>

  <section id="start-screen" class="screen">
    <div class="panel">
      <p class="eyebrow pixel-copy">空中玩具战场 · 飞行机库</p>
      <img class="modal-fighter" src="assets/characters/player-fighter.png" alt="蓝白小战机">
      <h1>飞机大战</h1>
      <p class="panel-version pixel-copy">飞机大战 · V2.2</p>
      <p class="lead">移动鼠标驾驶战斗机，自动发射双列火球。<br>击败怪物、挑战 BOSS，收集碎片解锁追踪弹和激光枪！</p>
      <div class="scene-choices" aria-label="选择游戏背景">
        <button class="scene-choice selected" type="button" data-scene-theme="backgroundTopdown" aria-label="海岛俯瞰 俯视"><span class="scene-name">海岛俯瞰</span><small class="scene-view">俯视</small></button>
        <button class="scene-choice" type="button" data-scene-theme="backgroundPerspective" aria-label="海天远航 斜视"><span class="scene-name">海天远航</span><small class="scene-view">斜视</small></button>
      </div>
      <button id="start-button" class="primary">开始出击</button>
    </div>
  </section>

  <section id="upgrade-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="upgrade-title">
    <div class="panel">
      <p class="eyebrow">飞机碎片集齐了</p>
      <h2 id="upgrade-title">可升级特殊武器</h2>
      <p id="upgrade-copy" class="lead"></p>
      <div class="button-row">
        <button id="accept-upgrade" class="primary">立即升级</button>
        <button id="defer-upgrade" class="secondary">暂不升级</button>
      </div>
    </div>
  </section>

  <section id="game-over" class="screen hidden">
    <div class="panel">
      <p class="eyebrow pixel-copy">本次飞行结束</p>

globalThis.GameRules = {
  enemyStats: {
    eagle: { hp: 20, damage: 10 },
    drone: { hp: 30, damage: 30 },
    bat: { hp: 10, dps: 10 },
    wizard: { hp: 50, damage: 30 }
  },
  maxAttackLevel() { return 5; },
  maxWeaponLevel() { return 3; },
  playerGunAnchors() {
    return [{ x: -16, y: -19 }, { x: 16, y: -19 }];
  },
  sequenceLoopY(anchorY, offset, sequenceLength, reentryMargin) {
    return ((anchorY + offset + reentryMargin) % sequenceLength) - reentryMargin;
  },
  bossHealthRange(number) {
    const multiplier = 1.45 ** (number - 1);
    return [Math.round(160 * multiplier), Math.round(220 * multiplier)];
  },
  bulletDamage(level) {
    return 2 + 2 * Math.min(level, this.maxAttackLevel());
  },
  specialDamage(type, level) {
    const values = type === 'homing' ? [0, 45, 65, 85] : [0, 35, 50, 65];
    return values[Math.min(level, this.maxWeaponLevel(type))];
  },
  specialWeaponInterval(type) { return 1.5; },
  damageState(hp, maxHp) {
    const ratio = maxHp > 0 ? hp / maxHp : 1;
    if (ratio < .35) return 'fire';
    if (ratio < .65) return 'smoke';
    return 'none';
  },
  difficulty(bosses) {
    const steps = Math.max(0, bosses - 1);
    return {
      hp: Number((1 + Math.min(.18 * steps, .9)).toFixed(2)),
      speed: Number((1 + Math.min(.06 * steps, .3)).toFixed(2)),
      spawnInterval: Number(Math.max(.5, 1.55 - .08 * steps).toFixed(2))
    };
  },
  bossScale(number) {
    return { speed: 1 + Math.min(.04 * (number - 1), .28), cooldown: Math.max(.6, 1 - .06 * (number - 1)) };
  },
  advanceBossEntrance(boss, dt) {
    if (boss.entered) return { y: boss.y, entered: true };
    const y = Math.min(119, boss.y + 90 * boss.speedScale * dt);
    return { y, entered: y >= 119 };
  },
  chooseFragmentDrop(fragments, weaponLevels, roll) {
    const available = ['homing', 'laser'].filter(type => weaponLevels[type] < this.maxWeaponLevel(type));
    if (!available.length) return null;
    const lowest = Math.min(...available.map(type => weaponLevels[type]));
    const candidates = available.filter(type => weaponLevels[type] === lowest);
    return candidates.length === 2 ? candidates[Math.floor(roll * 2)] : candidates[0];
  },
  canUpgrade(fragments, level = 0, type = 'homing') {
    return fragments >= 5 && level < this.maxWeaponLevel(type);
  },
  applyFragmentUpgrade(fragments, level, accepted, type = 'homing') {
    return accepted && this.canUpgrade(fragments, level, type)
      ? { fragments: fragments - 5, level: level + 1 }
      : { fragments, level };
  },
  applyAttackUpgrade(xp, level) {
    return xp >= 50 && level < this.maxAttackLevel()
      ? { xp: xp - 50, level: level + 1, upgraded: true }
      : { xp, level, upgraded: false };
  },
  killExperience(type, bossHp) {

  },
  shouldSpawnBoss(normalKills) {
    return normalKills > 0 && normalKills % 10 === 0;
  },
  clampPoint(x, y, width, height, margin) {

      x: Math.max(margin, Math.min(width - margin, x)),
      y: Math.max(margin, Math.min(height - margin, y))

  },
  circlesOverlap(a, b) {

  },
  nearestForwardTarget(player, targets) {
    let nearest = null;
    let distance = Infinity;
    for (const target of targets) {
      if (target.y >= player.y) continue;
      const nextDistance = Math.hypot(target.x - player.x, target.y - player.y);
      if (nextDistance < distance) {
        nearest = target;
        distance = nextDistance;
      }
    }
    return nearest;
  },
  awardNormalKill(state) {

      xp: state.xp + 5,

      bossPending: this.shouldSpawnBoss(normalKills)
    };
  },
  awardBossKill(state, bossHp, fragmentType) {
    return {
      xp: state.xp + bossHp,
      bosses: state.bosses + 1,
      fragments: fragmentType ? { ...state.fragments, [fragmentType]: state.fragments[fragmentType] + 2 } : state.fragments
    };
  },
  canSpawnEnemy(activeNormalEnemies, bossActive) {
    return !bossActive && activeNormalEnemies < 10;
  }
};

        const body = Math.sin(Math.PI * 2 * (250 - 95 * progress) * time) * Math.sin(Math.PI * progress) * .045;
        return (chime + dust + body) * edgeEnvelope(time, duration, .004, .055);
      });
    }
    function synthesizeWeaponSwitch() {
      const duration = .28;
      const random = mulberry32(0x53574954);
      let noiseLow = 0;
      return createSound(duration, ({ time, progress }) => {
        const white = random() * 2 - 1;
        noiseLow += .18 * (white - noiseLow);
        const clickA = (white - noiseLow) * pulseEnvelope(time, .012, .0015, .018) * .15;
        const clickB = (white - noiseLow) * pulseEnvelope(time, .12, .0015, .024) * .14;
        const metalA = Math.sin(Math.PI * 2 * 710 * (time - .012)) * pulseEnvelope(time, .012, .002, .045) * .075;
        const metalB = Math.sin(Math.PI * 2 * 530 * (time - .12)) * pulseEnvelope(time, .12, .002, .06) * .085;
        const lock = Math.sin(Math.PI * 2 * (260 + 120 * progress) * time) * pulseEnvelope(time, .17, .008, .055) * .055;
        return (clickA + clickB + metalA + metalB + lock) * edgeEnvelope(time, duration, .003, .04);
      });
    }
    function synthesizeFragment() {
      const duration = .18;
      const random = mulberry32(0x46524147);
      let noiseLow = 0;
      return createSound(duration, ({ time, progress }) => {
        const white = random() * 2 - 1;
        noiseLow += .2 * (white - noiseLow);
        const chimeA = Math.sin(Math.PI * 2 * 1320 * time) * Math.exp(-time / .055) * .09;
        const chimeB = Math.sin(Math.PI * 2 * 1920 * time) * Math.exp(-time / .038) * .055;
        const tick = (white - noiseLow) * Math.exp(-time / .009) * .07;
        const settle = Math.sin(Math.PI * 2 * 760 * time) * Math.sin(Math.PI * progress) * .025;
        return (chimeA + chimeB + tick + settle) * edgeEnvelope(time, duration, .0015, .025);
      });
    }
    const synthesizers = {
      'missile-hit': synthesizeMissileHit,
      'explode-mechanical': synthesizeMechanicalExplosion,
      'explode-soft': synthesizeSoftExplosion,
      'boss-explode': synthesizeBossExplosion,
      hurt: synthesizeHurt,
      machinegun: () => synthesizeMachinegun(0x4d473031),
      hit: synthesizeHit,
      'orange-shot': synthesizeOrangeShot,
      'game-over': synthesizeGameOver,
      'boss-charge': synthesizeBossCharge,
      'magic-break': synthesizeMagicBreak,
      'weapon-switch': synthesizeWeaponSwitch,
      fragment: synthesizeFragment,
      'machinegun-2': () => synthesizeMachinegun(0x4d473032, 8, .085),
      'machinegun-3': () => synthesizeMachinegun(0x4d473033, -7, .095)
    };
    return synthesizers[name]?.() || null;
  }

  function synthesizeFirearmSound(name, sampleRate) {
    const upgrading = name === 'upgrade'
    const duration = upgrading ? .72 : .32
    const contacts = upgrading
      ? [[.018, .075, 730, .022], [.12, .11, 490, .027], [.32, .07, 1120, .017], [.545, .20, 245, .043], [.586, .085, 890, .026]]
      : [[.012, .06, 970, .017], [.16, .145, 355, .036], [.198, .09, 1190, .020]]
    const slides = upgrading ? [[.17, .15, .075], [.37, .15, .10]] : [[.022, .10, .09]]
    const samples = new Float32Array(Math.ceil(duration * sampleRate))
    let seed = upgrading ? 0x55504733 : 0x53575433
    let low = 0
    let slow = 0
    const smooth = value => { const x = Math.max(0, Math.min(1, value)); return x * x * (3 - 2 * x) }
    const fastAlpha = 1 - Math.exp(-2 * Math.PI * 4200 / sampleRate)
    const slowAlpha = 1 - Math.exp(-2 * Math.PI * 480 / sampleRate)
    for (let i = 0; i < samples.length; i++) {
      const time = i / sampleRate
      let word = seed += 0x6d2b79f5
      word = Math.imul(word ^ word >>> 15, word | 1)
      word ^= word + Math.imul(word ^ word >>> 7, word | 61)
      const white = ((word ^ word >>> 14) >>> 0) / 4294967296 * 2 - 1
      low += fastAlpha * (white - low)
      slow += slowAlpha * (white - slow)
      const metalNoise = low - slow
      let sound = 0
      for (const [onset, gain, frequency, decay] of contacts) {
        const t = time - onset
        if (t < 0) continue
        const attack = smooth(t / .0009)
        const strike = metalNoise * Math.exp(-t / .007) * 1.55
        const body = Math.sin(2 * Math.PI * frequency * t) * Math.exp(-t / decay) * .64
        const metal = (Math.sin(2 * Math.PI * frequency * 2.37 * t) * .25 + Math.sin(2 * Math.PI * frequency * 3.91 * t) * .12) * Math.exp(-t / (decay * .45))
        sound += (strike + body + metal) * gain * attack
      }
      for (const [onset, length, gain] of slides) {
        const t = time - onset
        if (t < 0 || t >= length) continue
        const progress = t / length
        const motion = Math.sin(Math.PI * progress) ** .65
        const teeth = .62 + .38 * Math.sin(2 * Math.PI * (46 * t + 220 * t * t)) ** 2
        sound += metalNoise * motion * teeth * gain
      }
      const release = time - (upgrading ? .49 : .12)
      if (release >= 0) {
        const spring = Math.sin(2 * Math.PI * 1630 * release) * .025 + Math.sin(2 * Math.PI * 2287 * release) * .009
        sound += spring * smooth(release / .001) * Math.exp(-release / .016)
      }
      samples[i] = sound * smooth(time / .001) * smooth((duration - time) / .025)
    }
    samples[0] = 0
    samples[samples.length - 1] = 0
    return samples
  }

  function synthesizeMechanicalSound(name, sampleRate) {
    const durations = { start: 1.05, hurt: .24 }
    const duration = durations[name]
    const data = new Float32Array(Math.ceil(sampleRate * duration))
    let seed = { start: 0x53545232, hurt: 0x48525432 }[name]
    let low = 0
    let slow = 0
    let rotorPhase = 0
    let bladePhase = 0
    const smooth = value => { const x = Math.max(0, Math.min(1, value)); return x * x * (3 - 2 * x) }
    const pulse = (time, onset, attack, decay) => {
      const t = time - onset
      return t < 0 ? 0 : smooth(t / attack) * Math.exp(-t / decay)
    }
    for (let i = 0; i < data.length; i++) {
      const time = i / sampleRate
      const progress = i / (data.length - 1)
      let value = seed += 0x6d2b79f5
      value = Math.imul(value ^ value >>> 15, value | 1)
      value ^= value + Math.imul(value ^ value >>> 7, value | 61)
      const white = ((value ^ value >>> 14) >>> 0) / 4294967296 * 2 - 1
      // Sample-rate-aware noise bands: body and a short, softened metal transient.
      low += (1 - Math.exp(-2 * Math.PI * 2300 / sampleRate)) * (white - low)
      slow += (1 - Math.exp(-2 * Math.PI * 240 / sampleRate)) * (white - slow)
      const band = low - slow
      let sample = 0
      if (name === 'start') {
        rotorPhase += 2 * Math.PI * (68 + 155 * smooth(progress / .76)) / sampleRate
        bladePhase += 2 * Math.PI * (350 + 690 * smooth(progress / .86)) / sampleRate
        const spool = smooth(time / .18) * (1 - smooth((time - .67) / .38))
        const thrust = pulse(time, .30, .15, .30)
        const body = (Math.sin(rotorPhase) + .24 * Math.sin(rotorPhase * 2)) * spool * .095
        const turbine = (Math.sin(bladePhase) + .12 * Math.sin(bladePhase * 2.11)) * spool * .024
        const jet = band * thrust * .20 + slow * spool * .10
        const ignition = Math.sin(2 * Math.PI * 106 * time) * pulse(time, 0, .004, .055) * .12
        sample = body + turbine + jet + ignition
      } else if (name === 'hurt') {
        const impact = pulse(time, 0, .0015, .023)
        const shell = Math.sin(2 * Math.PI * 193 * time) * pulse(time, 0, .002, .062) * .17
        const dent = (Math.sin(2 * Math.PI * 487 * time) * .065 + Math.sin(2 * Math.PI * 791 * time) * .037) * pulse(time, 0, .002, .045)
        const rattle = band * (pulse(time, .037, .0015, .014) + pulse(time, .079, .0015, .019) * .6) * .16
        sample = band * impact * .27 + shell + dent + rattle
      }
      data[i] = sample * smooth(time / .0015) * smooth((duration - time) / .02)
    }
    data[0] = 0
    data[data.length - 1] = 0
    return data
  }

  function createSoundBuffer(name) {
    const audio = ensureAudio();
    if (!audio) return null;
    const sampleRate = audio.sampleRate || 22050;
    const foleySamples = name === 'upgrade' || name === 'weapon-switch'
      ? synthesizeFirearmSound(name, sampleRate)
      : name === 'start' || name === 'hurt' ? synthesizeMechanicalSound(name, sampleRate) : createFoleySamples(name, sampleRate);
    if (foleySamples) {
      const buffer = audio.createBuffer(1, foleySamples.length, sampleRate);
      buffer.getChannelData(0).set(foleySamples);
      soundBuffers[name] = buffer;
      return buffer;
    }
    if (name === 'missile-launch') {
      const duration = .4;
      const length = Math.ceil(sampleRate * duration);
      const buffer = audio.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      let seed = 0x4d495353;
      let ignitionPhase = 0;
      let whistlePhase = 0;
      let noiseLow = 0;
      const random = () => {
        let value = seed += 0x6d2b79f5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
      for (let i = 0; i < length; i++) {
        const time = i / sampleRate;
        const progress = i / (length - 1);
        const edge = Math.min(1, time / .008, (duration - time) / .025);
        const ignitionProgress = Math.min(1, time / .13);
        const ignitionEnvelope = time < .13 ? Math.sin(Math.PI * ignitionProgress) ** 1.4 : 0;
        const ignitionFrequency = 92 + 62 * ignitionProgress;
        ignitionPhase += Math.PI * 2 * ignitionFrequency / sampleRate;
        const ignition = Math.sin(ignitionPhase) * ignitionEnvelope * .075;
        const white = random() * 2 - 1;
        noiseLow += .12 * (white - noiseLow);
        const airyNoise = white - noiseLow;
        const jetAttack = Math.min(1, time / .025);
        const jetRelease = (1 - progress) ** 1.55;
        const jet = airyNoise * jetAttack * jetRelease * .078;
        const whistleFrequency = 470 - 170 * progress;
        whistlePhase += Math.PI * 2 * whistleFrequency / sampleRate;
        const whistleEnvelope = Math.sin(Math.PI * progress) * (1 - progress) ** 1.3;
        const whistle = Math.sin(whistlePhase) * whistleEnvelope * .022;
        data[i] = (ignition + jet + whistle) * Math.max(0, edge);
      }
      data[0] = 0;
      data[length - 1] = 0;
      soundBuffers[name] = buffer;
      return buffer;
    }
    const definitions = {
      fire: [650, 390, .065, .16, 'square'],
      'wizard-shot': [420, 760, .18, .16, 'triangle'],
      'blue-shot': [820, 1280, .13, .16, 'saw'],
      laser: [760, 1050, .11, .13, 'saw'],
      boss: [95, 40, .58, .3, 'saw'],
      upgrade: [520, 1120, .34, .24, 'triangle'],
      start: [330, 720, .36, .2, 'triangle']
    };
    const [startFrequency, endFrequency, duration, volume, wave] = definitions[name];
    const length = Math.ceil(sampleRate * duration);
    const buffer = audio.createBuffer(1, length, sampleRate);
    const data = buffer.getChannelData(0);
    let phase = 0;
    for (let i = 0; i < length; i++) {
      const progress = i / length;
      const frequency = startFrequency + (endFrequency - startFrequency) * progress;
      phase += Math.PI * 2 * frequency / sampleRate;
      const envelope = (1 - progress) ** 2;
      let sample;
      if (wave === 'square') sample = Math.sin(phase) >= 0 ? 1 : -1;
      else if (wave === 'saw') sample = ((phase / Math.PI) % 2) - 1;
      else if (wave === 'noise') sample = Math.random() * 2 - 1;
      else sample = Math.asin(Math.sin(phase)) * 2 / Math.PI;
      data[i] = sample * envelope * volume;
    }
    soundBuffers[name] = buffer;
    return buffer;
  }

  function playSound(name) {
    const now = performance.now();
    const limits = { fire: 120, machinegun: 70, 'missile-launch': 120, 'missile-hit': 100, hit: 110, laser: 150, 'magic-break': 100, 'wizard-shot': 280, 'orange-shot': 180, 'blue-shot': 140 };
    if (limits[name] && now - (soundCooldowns[name] || 0) < limits[name]) return;
    soundCooldowns[name] = now;
    const audio = ensureAudio();
    if (!audio) return;
    const bufferName = name === 'machinegun' ? ['machinegun', 'machinegun-2', 'machinegun-3'][machinegunSoundIndex++ % 3] : name;
    const source = audio.createBufferSource();
    source.buffer = soundBuffers[bufferName] || createSoundBuffer(bufferName);
    source.connect(audio.destination);
    source.onended = () => source.disconnect();
    source.start();
  }

  function resetGame() {
    ui['boss-panel'].classList.add('hidden');
    game = {
      running: false,
      paused: false,
      time: 0,
      shake: 0,
      player: { id: 'player', x: W / 2, y: H - 105, tx: W / 2, ty: H - 105, r: 26, hp: 100, maxHp: 100, invulnerable: 0, hasTarget: false },
      bullets: [],
      enemies: [],
      scenery: [createScenery(H * .71, 'lake', 190), ...Array.from({ length: 11 }, (_, index) => createScenery(H * .66 + index * 27))],
      enemyBullets: [],
      particles: [],
      damageEffects: [],
      damageEffectTimer: 0,
      impacts: [],
      floaters: [],
      xp: 0,
      normalKills: 0,
      bosses: 0,
      attackLevel: 0,
      fragments: { homing: 0, laser: 0 },
      weaponLevels: { homing: 0, laser: 0 },
      activeWeapon: null,
      boss: null,
      spawnTimer: .7,
      fireTimer: 0,
      machinegunBeat: -1,
      specialTimer: 0,
      laserTimer: 0,
      laserTargetId: null,
      laserFlash: null,
      hudTimer: 0,
      laserTarget: null
    };
    updateHud();
    drawScene();
    if (window.__testMode) {
      window.__gameTest = {
        equip(type, level) { game.weaponLevels[type] = level; game.activeWeapon = type; game.specialTimer = 0; game.laserTimer = 0; game.laserTargetId = null; },
        addTarget() { game.spawnTimer = Infinity; game.enemies = [{ id: -1, type: 'drone', x: W / 2, y: 180, r: 25, hp: 100000, maxHp: 100000, dead: false, age: 0, phase: 'enter', shootTimer: 999, baseX: W / 2, targetY: 180, vx: 0, vy: 0, speedScale: .0001 }]; },
        finish(normalKills, bosses, attackLevel) { game.normalKills = normalKills; game.bosses = bosses; game.attackLevel = attackLevel; endGame(); }
      };
    }
  }

  function startGame() {
    if (!assetsReady) return;
    resetGame();
    game.running = true;
    playSound('start');
    ui['start-screen'].classList.add('hidden');
    ui['game-over'].classList.add('hidden');
    for (const id of ['hud', 'fragments', 'weapons', 'upgrade-attack']) ui[id].classList.remove('hidden');
    lastTime = performance.now();
  }

  function random(min, max) { return min + Math.random() * (max - min); }
  function pick(items) { return items[Math.floor(Math.random() * items.length)]; }
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function createScenery(y = H * .65, type = pick(['tree', 'tree', 'bush', 'bush', 'lake']), fixedX) {
    const depth = clamp((y - H * .64) / (H * .36), 0, 1);
    const roadHalfWidth = 58 + depth * 245;
    const side = Math.random() < .5 ? -1 : 1;
    const innerEdge = W / 2 + side * (roadHalfWidth + 45);
    const outerEdge = side < 0 ? 40 : W - 40;
    return {
      type,
      x: fixedX ?? random(Math.min(innerEdge, outerEdge), Math.max(innerEdge, outerEdge)),
      y,
      phase: random(0, Math.PI * 2)
    };
  }

  function updateScenery(dt) {
    for (const item of game.scenery) {
      const depth = clamp((item.y - H * .64) / (H * .36), 0, 1);
      item.y += (30 + depth * 115) * dt;
      item.phase += dt * (item.type === 'lake' ? 1.8 : 2.4);
      if (item.y > H + 85) Object.assign(item, createScenery(H * .645 + random(0, 14)));
    }
  }

  function addParticle(x, y, color, count = 10, speed = 180) {
    for (let i = 0; i < count && game.particles.length < 180; i++) {
      const angle = Math.random() * Math.PI * 2;
      const velocity = random(speed * .35, speed);
      game.particles.push({ x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity, life: random(.25, .65), maxLife: .65, size: random(2, 7), color });
    }
  }

  function addImpact(x, y, key, target = null) {
    if (game.impacts.length < 24) game.impacts.push({ x, y, key, target, life: .26, maxLife: .26 });
  }

  function addFloater(x, y, text, color = '#fff') {
    game.floaters.push({ x, y, text, color, life: .8 });
  }

  function showToast(text) {
    ui.toast.textContent = text;
    ui.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 1700);
  }

  function damagePlayer(amount) {
    const player = game.player;
    if (player.invulnerable > 0 || !game.running) return false;
    player.hp = Math.max(0, player.hp - amount);
    player.invulnerable = .75;
    game.shake = 10;
    playSound('hurt');
    addParticle(player.x, player.y, '#ff5b69', 18, 220);
    addFloater(player.x, player.y - 38, `-${amount}`, '#ffecf0');
    updateHud();
    if (player.hp <= 0) endGame();
    return true;
  }

  function resolveEnemyCollision(enemy, player) {
    if (enemy.dead || !GameRules.circlesOverlap(enemy, player)) return false;
    const damage = enemy.type === 'bat' ? GameRules.enemyStats.bat.dps : GameRules.enemyStats[enemy.type].damage;
    damagePlayer(damage);
    killEnemy(enemy);
    return true;
  }

  function spawnEnemy() {
    const type = pick(['eagle', 'drone', 'bat', 'wizard']);
    const stat = GameRules.enemyStats[type];
    const difficulty = GameRules.difficulty(game.bosses);
    const hp = Math.round(stat.hp * difficulty.hp);
    const enemy = {
      id: nextId++, type, x: random(80, W - 80), y: -55, r: type === 'wizard' ? 30 : 25,
      hp, maxHp: hp, age: 0, phase: 'enter', shootTimer: random(1.1, 2.1), attached: false, speedScale: difficulty.speed,
      baseX: 0, targetY: random(110, 270), vx: 0, vy: 0
    };
    enemy.baseX = enemy.x;
    game.enemies.push(enemy);
  }

  function spawnBoss() {
    const number = game.bosses + 1;
    const [minHp, maxHp] = GameRules.bossHealthRange(number);
    const hp = Math.floor(random(minHp, maxHp + 1));
    const variant = Math.random() < .5 ? 'brown' : 'blue';
    const scale = GameRules.bossScale(number);
    const boss = {
      id: nextId++, type: 'boss', variant, number, x: W / 2, y: -100, r: 60,
      hp, maxHp: hp, initialHp: hp, age: 0, shootTimer: 1.3 * scale.cooldown, actionTimer: variant === 'brown' ? 4 : 2.8,
      charging: false, entered: false, vx: 0, vy: 0, speedScale: scale.speed, cooldownScale: scale.cooldown
    };
    game.enemies.length = 0;
    game.enemyBullets.length = 0;
    game.boss = boss;
    game.enemies.push(boss);
    playSound('boss');
    ui['boss-panel'].classList.remove('hidden');
    ui['boss-name'].textContent = variant === 'brown' ? `BOSS ${number} · 大地重锤` : `BOSS ${number} · 蓝色闪电`;
    showToast(`BOSS ${number} 来了！`);
  }

  function shootEnemyBullet(x, y, angle, speed, damage, color = '#ff724d', destructible = false, visualKey = 'enemyBullet') {
    game.enemyBullets.push({ id: nextId++, x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: destructible ? 13 : 8, damage, color, destructible, visualKey, life: 7 });
  }

  function aimAngle(from, to) { return Math.atan2(to.y - from.y, to.x - from.x); }

  function updateEnemy(enemy, dt) {
    const speedScale = enemy.speedScale || 1;
    enemy.age += dt * speedScale;
    if (enemy.type === 'boss') return updateBoss(enemy, dt);
    const player = game.player;
    if (enemy.type === 'eagle') {
      if (enemy.phase === 'enter') {
        enemy.y += 75 * speedScale * dt;
        enemy.x = enemy.baseX + Math.sin(enemy.age * 3) * 70;
        if (enemy.y >= 120) { enemy.phase = 'circle'; enemy.age = 0; }
      } else if (enemy.phase === 'circle') {
        enemy.x = enemy.baseX + Math.sin(enemy.age * 4.2) * 86;
        enemy.y = 120 + Math.cos(enemy.age * 4.2) * 22;
        if (enemy.age > 1.15) {
          const angle = aimAngle(enemy, player);
          enemy.vx = Math.cos(angle) * 310 * speedScale;
          enemy.vy = Math.sin(angle) * 310 * speedScale;
          enemy.phase = 'dive';
        }
      } else {
        enemy.x += enemy.vx * dt;
        enemy.y += enemy.vy * dt;
      }
    } else if (enemy.type === 'drone') {
      const angle = aimAngle(enemy, player);
      const speed = (95 + Math.min(enemy.age * 9, 70)) * speedScale;
      enemy.x += Math.cos(angle) * speed * dt;
      enemy.y += Math.sin(angle) * speed * dt;
    } else if (enemy.type === 'bat') {
      const angle = aimAngle(enemy, player);
      enemy.x += Math.cos(angle) * 160 * speedScale * dt;
      enemy.y += Math.sin(angle) * 160 * speedScale * dt;
    } else if (enemy.type === 'wizard') {
      if (enemy.y < enemy.targetY) enemy.y += 75 * speedScale * dt;
      else enemy.x += Math.sin(enemy.age * 2.2) * 38 * speedScale * dt;
      enemy.shootTimer -= dt;
      if (enemy.shootTimer <= 0 && enemy.y > 0) {
        const angle = aimAngle(enemy, player);
        playSound('wizard-shot');
        shootEnemyBullet(enemy.x - 12, enemy.y + 13, angle, 165, 30, '#8b62ff', true, EnemyProjectileVisuals.wizard);
        enemy.shootTimer = random(2, 2.7);
      }
    }

    if (enemy.type === 'eagle' || enemy.type === 'drone' || enemy.type === 'bat' || enemy.type === 'wizard') resolveEnemyCollision(enemy, player);
    if (enemy.y > H + 100 || enemy.x < -160 || enemy.x > W + 160) enemy.dead = true;
  }

  function updateBoss(boss, dt) {
    boss.age += dt * boss.speedScale;
    const player = game.player;
    const entrance = GameRules.advanceBossEntrance(boss, dt);
    boss.y = entrance.y;
    boss.entered = entrance.entered;
    if (!boss.entered) {
      return;
    }
    boss.shootTimer -= dt;
    boss.actionTimer -= dt;
    if (boss.variant === 'brown') {
      if (boss.charging) {
        boss.y += boss.vy * boss.speedScale * dt;
        boss.x += boss.vx * boss.speedScale * dt;
        if (boss.y > H + 100) { boss.x = random(180, W - 180); boss.y = -80; boss.charging = false; boss.entered = false; boss.actionTimer = 4.8; }
      } else {
        boss.x = W / 2 + Math.sin(boss.age * .8) * 330;
        if (boss.shootTimer <= 0) {
          const base = aimAngle(boss, player);
          playSound('orange-shot');
          for (let i = -2; i <= 2; i++) shootEnemyBullet(boss.x, boss.y + 48, base + i * .18, 175, 15, '#ff6a45', false, EnemyProjectileVisuals[boss.variant]);
          boss.shootTimer = 1.55 * boss.cooldownScale;
        }
        if (boss.actionTimer <= 0) {
          const angle = aimAngle(boss, player);
          boss.vx = Math.cos(angle) * 270;
          boss.vy = Math.sin(angle) * 270;
          boss.charging = true;
          playSound('boss-charge');
        }
      }
    } else {
      boss.x = W / 2 + Math.sin(boss.age * 1.75) * 430;
      boss.y = 120 + Math.sin(boss.age * 2.4) * 22;
      if (boss.shootTimer <= 0) {
        const base = aimAngle(boss, player);
        playSound('blue-shot');
        shootEnemyBullet(boss.x - 55, boss.y + 30, base - .09, 240, 15, '#55e8ff', false, EnemyProjectileVisuals[boss.variant]);
        shootEnemyBullet(boss.x + 55, boss.y + 30, base + .09, 240, 15, '#55e8ff', false, EnemyProjectileVisuals[boss.variant]);
        boss.shootTimer = .82 * boss.cooldownScale;
      }
    }
    if (GameRules.circlesOverlap({ ...boss, r: 48 }, player)) damagePlayer(20);
  }

  function firePlayer() {
    const damage = GameRules.bulletDamage(game.attackLevel);
    for (const gun of GameRules.playerGunAnchors()) {
      game.bullets.push({ id: nextId++, type: 'fire', x: game.player.x + gun.x, y: game.player.y - 34, vx: 0, vy: -720, r: 7, damage, life: 2 });
    }
  }

  function fireHoming() {
    const target = GameRules.nearestForwardTarget(game.player, game.enemies.filter(enemy => !enemy.dead));
    if (!target) return;
    const bullet = { id: nextId++, type: 'homing', x: game.player.x, y: game.player.y - 34, vx: 0, vy: -360, r: 11, damage: GameRules.specialDamage('homing', game.weaponLevels.homing), life: 5, targetId: target.id };
    game.bullets.push(bullet);
    playSound('missile-launch');
    if (window.__testMode) window.__combatStats.homingShots.push(performance.now());
  }

  function updateBullets(dt) {
    for (const bullet of game.bullets) {
      if (bullet.type === 'homing') {
        const target = game.enemies.find(enemy => enemy.id === bullet.targetId && !enemy.dead) || GameRules.nearestForwardTarget(bullet, game.enemies.filter(enemy => !enemy.dead));
        if (target) {
          bullet.targetId = target.id;
          const angle = aimAngle(bullet, target);
          bullet.vx += Math.cos(angle) * 950 * dt;
          bullet.vy += Math.sin(angle) * 950 * dt;
          const speed = Math.hypot(bullet.vx, bullet.vy) || 1;
          bullet.vx = bullet.vx / speed * 420;
          bullet.vy = bullet.vy / speed * 420;
        }
      }
      bullet.x += bullet.vx * dt;
      bullet.y += bullet.vy * dt;
      bullet.life -= dt;
      if (bullet.life <= 0 || bullet.y < -60 || bullet.x < -60 || bullet.x > W + 60) bullet.dead = true;
    }
    for (const shot of game.enemyBullets) {
      shot.x += shot.vx * dt;
      shot.y += shot.vy * dt;
      shot.life -= dt;
      if (shot.life <= 0 || shot.y > H + 60 || shot.x < -60 || shot.x > W + 60) shot.dead = true;
      if (!shot.dead && GameRules.circlesOverlap(shot, game.player)) {
        if (damagePlayer(shot.damage)) addImpact(shot.x, shot.y, ImpactVisuals[shot.visualKey] || 'hitMachinegun');
        shot.dead = true;
      }
    }
  }

  function damageEnemy(enemy, damage, color = '#fff', impactKey = 'hitMachinegun') {
    if (enemy.dead) return;
    enemy.hp -= damage;
    playSound(impactKey === ImpactVisuals.homing ? 'missile-hit' : impactKey === ImpactVisuals.laser ? 'laser' : 'hit');
    addFloater(enemy.x, enemy.y - enemy.r, `-${Math.round(damage)}`, color);
    addImpact(enemy.x, enemy.y, impactKey, impactKey === ImpactVisuals.laser ? enemy : null);
    if (enemy.hp <= 0) killEnemy(enemy);
  }

  function killEnemy(enemy) {
    enemy.dead = true;
    addParticle(enemy.x, enemy.y, enemy.type === 'boss' ? '#ffd44a' : '#fff3a1', enemy.type === 'boss' ? 70 : 22, enemy.type === 'boss' ? 360 : 220);
    game.shake = enemy.type === 'boss' ? 18 : 5;
    playSound(enemy.type === 'boss' ? 'boss-explode' : enemy.type === 'drone' ? 'explode-mechanical' : 'explode-soft');
    if (enemy.type === 'boss') {
      const fragmentType = GameRules.chooseFragmentDrop(game.fragments, game.weaponLevels, Math.random());
      const result = GameRules.awardBossKill(game, enemy.initialHp, fragmentType);
      game.xp = result.xp;
      game.bosses = result.bosses;
      game.fragments = result.fragments;
      game.boss = null;
      ui['boss-panel'].classList.add('hidden');
      if (fragmentType) playSound('fragment');
      showToast(fragmentType ? `获得 2 枚${fragmentType === 'homing' ? '追踪弹' : '激光'}碎片！` : '装备已满级！');
      if (fragmentType && GameRules.canUpgrade(game.fragments[fragmentType], game.weaponLevels[fragmentType], fragmentType)) setTimeout(() => openUpgrade(fragmentType), 450);
    } else {
      const result = GameRules.awardNormalKill(game);
      game.xp = result.xp;
      game.normalKills = result.normalKills;
      if (result.bossPending) spawnBoss();
    }
    updateHud();
  }

  function checkCollisions() {
    for (const bullet of game.bullets) {
      if (bullet.dead) continue;
      for (const shot of game.enemyBullets) {
        if (!shot.dead && shot.destructible && GameRules.circlesOverlap(bullet, shot)) {
          bullet.dead = true;
          shot.dead = true;
          playSound('magic-break');
          addParticle(shot.x, shot.y, '#b69cff', 14, 180);
          break;
        }
      }
      if (bullet.dead) continue;
      for (const enemy of game.enemies) {
        if (!enemy.dead && GameRules.circlesOverlap(bullet, enemy)) {
          damageEnemy(enemy, bullet.damage, bullet.type === 'homing' ? '#ffe66a' : '#fff', ImpactVisuals[bullet.type]);
          bullet.dead = true;
          break;
        }
      }
    }
  }

  function updateLaser(dt) {
    game.laserTarget = null;
    if (game.activeWeapon !== 'laser' || game.weaponLevels.laser <= 0) { game.laserTimer = 0; game.laserTargetId = null; return; }
    const target = GameRules.nearestForwardTarget(game.player, game.enemies.filter(enemy => !enemy.dead));
    if (!target) { game.laserTimer = 0; game.laserTargetId = null; return; }
    if (game.laserTargetId !== target.id) { game.laserTargetId = target.id; game.laserTimer = 0; }
    game.laserTarget = target;
    game.laserTimer += dt;
    if (game.laserTimer >= GameRules.specialWeaponInterval('laser')) {
      game.laserTimer = 0;
      if (window.__testMode) window.__combatStats.laserHits.push(performance.now());
      const x = game.player.x;
      const y = game.player.y - 38;
      const dx = target.x - x;
      const dy = target.y - y;
      game.laserFlash = { x: game.player.x, y, target, targetX: target.x, targetY: target.y, rotation: Math.atan2(dy, dx), length: Math.hypot(dx, dy), life: .18, maxLife: .18 };
      damageEnemy(target, GameRules.specialDamage('laser', game.weaponLevels.laser), '#7ff8ff', ImpactVisuals.laser);
    }
    if (Math.random() < .35) addParticle(target.x + random(-8, 8), target.y + random(-8, 8), '#72f5ff', 1, 50);
  }

  function updateParticles(dt) {
    for (const particle of game.particles) {
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += 110 * dt;
      particle.life -= dt;
    }
    for (const floater of game.floaters) { floater.y -= 45 * dt; floater.life -= dt; }
    game.particles = game.particles.filter(p => p.life > 0);
    if (game.laserFlash) {
      const flash = game.laserFlash;
      flash.x = game.player.x;
      flash.y = game.player.y - 38;
      if (flash.target) {
        flash.targetX = flash.target.x;
        flash.targetY = flash.target.y;
        if (flash.target.dead) flash.target = null;
      }
      flash.rotation = Math.atan2(flash.targetY - flash.y, flash.targetX - flash.x);
      flash.length = Math.hypot(flash.targetX - flash.x, flash.targetY - flash.y);
      game.laserFlash.life -= dt;
      if (game.laserFlash.life <= 0) game.laserFlash = null;
    }
    for (const impact of game.impacts) {
      if (impact.target) {
        impact.x = impact.target.x;
        impact.y = impact.target.y;
        if (impact.target.dead) impact.target = null;
      }
      impact.life -= dt;
    }
    game.impacts = game.impacts.filter(impact => impact.life > 0);
    game.floaters = game.floaters.filter(f => f.life > 0);
  }

  function updateDamageEffects(dt) {
    game.damageEffectTimer -= dt;
    if (game.damageEffectTimer <= 0) {
      game.damageEffectTimer = .18;
      const owners = [game.player, game.boss].filter(Boolean);
      for (const owner of owners) {
        const state = GameRules.damageState(owner.hp, owner.maxHp);
        if (state === 'none') continue;
        if (game.damageEffects.length < 18) {
          const kind = state === 'fire' && Math.random() < .42 ? 'fire' : 'smoke';
          const x = owner.x + random(-18, 18);
          const y = owner.y + random(-14, 16);
          game.damageEffects.push({ ownerId: owner.id, kind, x, y, ownerX: owner.x, ownerY: owner.y, vx: random(-9, 9), vy: kind === 'fire' ? random(-25, -12) : random(-38, -20), life: kind === 'fire' ? .42 : .7, maxLife: kind === 'fire' ? .42 : .7 });
        }
      }
    }
    for (const effect of game.damageEffects) {
      const owner = effect.ownerId === 'player' ? game.player : game.boss;
      if (owner && !owner.dead) {
        effect.x += owner.x - effect.ownerX;
        effect.y += owner.y - effect.ownerY;
        effect.ownerX = owner.x; effect.ownerY = owner.y;
      }
      effect.x += effect.vx * dt; effect.y += effect.vy * dt; effect.life -= dt;
    }
    game.damageEffects = game.damageEffects.filter(effect => effect.life > 0);
  }

  function update(dt) {
    if (!game.running || game.paused) return;
    game.time += dt;
    game.shake = Math.max(0, game.shake - 45 * dt);
    updateScenery(dt);
    game.player.invulnerable = Math.max(0, game.player.invulnerable - dt);
    const machinegunBeat = Math.floor(game.time / .09);
    if (machinegunBeat !== game.machinegunBeat) { game.machinegunBeat = machinegunBeat; playSound('machinegun'); }
    game.fireTimer -= dt;
    if (game.fireTimer <= 0) { firePlayer(); game.fireTimer = .19; }
    game.specialTimer -= dt;
    if (game.activeWeapon === 'homing' && game.weaponLevels.homing > 0 && game.specialTimer <= 0) {
      fireHoming();
      game.specialTimer = GameRules.specialWeaponInterval('homing');
    }
    const activeNormalEnemies = game.enemies.reduce((count, enemy) => count + (enemy.type !== 'boss' && !enemy.dead ? 1 : 0), 0);
    if (GameRules.canSpawnEnemy(activeNormalEnemies, Boolean(game.boss))) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        spawnEnemy();
        game.spawnTimer = GameRules.difficulty(game.bosses).spawnInterval;
      }
    }
    for (const enemy of game.enemies) updateEnemy(enemy, dt);
    updateBullets(dt);
    updateLaser(dt);
    checkCollisions();
    updateParticles(dt);
    updateDamageEffects(dt);
    game.bullets = game.bullets.filter(b => !b.dead);
    game.enemyBullets = game.enemyBullets.filter(b => !b.dead);
    game.enemies = game.enemies.filter(e => !e.dead);
    game.hudTimer -= dt;
    if (game.hudTimer <= 0) { updateHud(); game.hudTimer = .1; }
  }

  function path(points, fill, stroke = null, width = 1) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
  }

  function ellipse(x, y, rx, ry, fill, stroke = null, width = 1) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
  }

  const PerspectiveClearCloudLayers = {
    far: ['perspectiveClearCloudFar', 1.5, H * .16, W * .45, W * .15, .24],
    near: ['perspectiveClearCloudNear', 2.7, H * .16, W * .55, W * .55 / 3, .32]
  };
  const PerspectiveScenerySequence = {
    length: 1260,
    entries: [
      ['perspectiveIslandChain', .52, -120, 220, 88, 1.7], ['perspectiveLighthouseReef', .21, 60, 176, 132, 1.8],
      ['perspectiveSailboat', .76, 240, 92, 68, 1.3], ['perspectiveBuoy', .39, 420, 42, 78, 1.25],
      ['perspectiveReef', .63, 600, 164, 96, 1.6], ['perspectiveSeaStack', .15, 780, 214, 178, 1.7],
      ['perspectiveCliffWaterfall', .82, 960, 360, 270, 1.5]
    ]
  };
  const TopdownScenerySequence = {
    length: 1815,
    entries: [
      ['topdownIslet02', .31, -780, 236, 156], ['topdownIslet01', .64, -570, 220, 176], ['topdownReef02', .23, -360, 246, 164], ['topdownReef01', .72, -150, 258, 150],
      ['topdownIsland01', .18, 55, 292, 208], ['topdownIsland02', .79, 300, 270, 198], ['topdownIsland03', .42, 555, 308, 220]
    ]
  };

  function drawBackground() {
    const topdown = activeSceneBackground === 'backgroundTopdown';
    if (!topdown) {
      drawSceneryAsset('backgroundPerspective', W / 2, H / 2, W, H);
      for (const [key, speed, y, width, height, alpha] of Object.values(PerspectiveClearCloudLayers)) {
        const drift = (game.time * speed) % width;
        for (const offset of [-3, -2, -1, 0, 1, 2, 3]) drawSceneryAsset(key, W / 2 - drift + offset * width, y, width, height, alpha);
      }
      const landscapeOffset = (game.time * 12) % PerspectiveScenerySequence.length;
      const horizonY = H * .42;
      const orderedScenery = [...PerspectiveScenerySequence.entries].sort((a, b) =>
        GameRules.sequenceLoopY(a[2], landscapeOffset, PerspectiveScenerySequence.length, 260) -
        GameRules.sequenceLoopY(b[2], landscapeOffset, PerspectiveScenerySequence.length, 260));
      orderedScenery.forEach(([key, x, y, width, height, foregroundScale]) => {
        const loopY = GameRules.sequenceLoopY(y, landscapeOffset, PerspectiveScenerySequence.length, 260);
        if (loopY < 0) return;
        const depth = clamp(loopY / (H - horizonY), 0, 1);
        const scale = .38 + depth * .72 + 1.1 * (foregroundScale - 1) * depth * depth;
        const sceneryY = horizonY + loopY;
        const contactHeight = clamp(height * scale * .22, 12, 54);
        const contactY = sceneryY + height * scale * .34;
        drawSceneryAsset('perspectiveWaterContact', W * x, contactY, width * scale * 1.12, contactHeight, .18 + depth * .34);
        drawSceneryAsset(key, W * x, sceneryY, width * scale, height * scale);
      });
      return;
    }
    const waterKey = topdown ? 'waterTopdownLoop' : 'waterPerspectiveLoop';
    const offset = (game.time * 12) % 720;
    for (let y = -360 + offset; y < H + 360; y += 720) drawSceneryAsset(waterKey, W / 2, y, W, 720);
    if (topdown) {
      const landscapeOffset = (game.time * 12) % TopdownScenerySequence.length;
      TopdownScenerySequence.entries.forEach(([key, x, y, width, height]) => {
        drawSceneryAsset(key, W * x, GameRules.sequenceLoopY(y, landscapeOffset, TopdownScenerySequence.length, 260), width, height);
      });
    }
    drawSceneryAsset('cloudMist01', W * .68, ((190 + offset * .45) % (H + 180)) - 90, 330, 126, .42);
    drawSceneryAsset('cloudMist02', W * .24, ((430 + offset * .32) % (H + 180)) - 90, 270, 96, .32);
    drawSceneryAsset('cloudMist03', W * .84, ((640 + offset * .58) % (H + 180)) - 90, 250, 72, .26);
  }

  function drawSceneryAsset(key, x, y, width, height, alpha = 1) {
    const image = assets[key];
    if (!image) return;
    if (window.__testMode) window.__renderStats.sceneryDraws.push(key);
    ctx.save();
    // Filter detailed perspective scenery during continuous minification and movement.
    ctx.imageSmoothingEnabled = key.startsWith('perspective') && !key.startsWith('perspectiveClearCloud');
    ctx.imageSmoothingQuality = 'high'; ctx.globalAlpha = alpha;
    ctx.drawImage(image, x - width / 2, y - height / 2, width, height);
    ctx.restore();
  }

  function drawScenery() {
    const ordered = [...game.scenery].sort((a, b) => a.y - b.y);
    for (const item of ordered) {
      const depth = clamp((item.y - H * .64) / (H * .36), 0, 1);
      const scale = .32 + depth * .7;
      const sway = item.type === 'lake' ? Math.sin(item.phase) * .018 : Math.sin(item.phase) * .07;
      drawCached(sprites[item.type], item.x, item.y, sway, .92, scale);
    }
  }

  function makeSprite(name, width, height, painter) {
    const sprite = document.createElement('canvas');
    sprite.width = width;
    sprite.height = height;
    const mainContext = ctx;
    ctx = sprite.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    if (window.__testMode) window.__renderStats.pixelSprites.push(name);
    painter(width / 2, height / 2);
    ctx = mainContext;
    return sprite;
  }

  function buildSpriteCache() {
    sprites.player = makeSprite('player', 190, 190, (x, y) => paintPlayer({ x, y: y - 4 }));
    sprites.eagle = makeSprite('eagle', 190, 150, (x, y) => paintEagle({ x, y }));
    sprites.drone = makeSprite('drone', 190, 130, (x, y) => paintDrone({ x, y }));
    sprites.bat = makeSprite('bat', 170, 130, (x, y) => paintBat({ x, y }));
    sprites.wizard = makeSprite('wizard', 200, 170, (x, y) => paintWizard({ x, y }));
    sprites.brownBoss = makeSprite('brownBoss', 290, 240, (x, y) => paintBoss({ x, y, variant: 'brown' }));
    sprites.blueBoss = makeSprite('blueBoss', 290, 240, (x, y) => paintBoss({ x, y, variant: 'blue' }));
    sprites.fireball = makeSprite('fireball', 34, 52, (x, y) => {
      pixelRect(x - 8, y - 15, 16, 24, '#ffdd58');
      pixelRect(x - 5, y - 20, 10, 8, '#fff7bc');
      pixelRect(x - 4, y + 9, 8, 18, '#ff6840');
    });
    sprites.missile = makeSprite('missile', 42, 72, (x, y) => {
      pixelRect(x - 9, y - 27, 18, 38, '#e9f7e7');
      pixelRect(x - 6, y - 21, 12, 17, '#6fe8f2');
      pixelRect(x - 17, y + 5, 9, 14, '#e85663'); pixelRect(x + 8, y + 5, 9, 14, '#e85663');
      pixelRect(x - 6, y + 12, 12, 16, '#ffcf4b'); pixelRect(x - 3, y + 28, 6, 12, '#ff7542');
    });
    sprites.tree = makeSprite('tree', 92, 118, (x, y) => {
      ctx.shadowColor = 'rgba(31,74,43,.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 6;
      ctx.fillStyle = '#84552d'; ctx.fillRect(x - 7, y + 12, 14, 42);
      ellipse(x, y - 15, 33, 39, '#2f9147', '#246f38', 4);
      ellipse(x - 20, y, 25, 28, '#49ad52'); ellipse(x + 20, y, 25, 28, '#3b9d49');
      ellipse(x + 12, y + 15, 8, 12, '#2f8544');
      ellipse(x - 9, y - 27, 10, 9, '#80d76d');
    });
    sprites.bush = makeSprite('bush', 88, 62, (x, y) => {
      ellipse(x - 22, y + 4, 25, 20, '#379849', '#24743a', 3);
      ellipse(x + 21, y + 4, 25, 20, '#4caf50', '#24743a', 3);
      ellipse(x, y - 7, 31, 25, '#61bd55', '#24743a', 3);
      ellipse(x - 9, y - 14, 7, 6, '#a8ec79');
    });
    sprites.lake = makeSprite('lake', 190, 84, (x, y) => {
      ellipse(x, y, 91, 36, '#b7e681');
      ellipse(x, y, 87, 33, '#43bde2', '#2d91bd', 4);
      ctx.strokeStyle = 'rgba(255,255,255,.72)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 51, y - 8); ctx.quadraticCurveTo(x - 20, y - 18, x + 9, y - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 8, y + 11); ctx.quadraticCurveTo(x + 22, y + 2, x + 50, y + 11); ctx.stroke();
    });
  }

  function drawCached(sprite, x, y, rotation = 0, alpha = 1, scale = 1) {
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(x, y); ctx.rotate(rotation); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
    ctx.drawImage(sprite, -sprite.width / 2, -sprite.height / 2);
    ctx.restore();
  }

  function drawAsset(key, x, y, width, height, rotation = 0, alpha = 1) {
    const image = assets[key];
    if (!image) return;
    if (window.__testMode) window.__renderStats.assetDraws.push(key);
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(x, y); ctx.rotate(rotation); ctx.globalAlpha = alpha;
    ctx.drawImage(image, -width / 2, -height / 2, width, height);
    ctx.restore();
  }

  function drawShadow(key, x, y, width, height, alpha = 1) {
    const image = assets[key];
    if (!image) return;
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = alpha;
    ctx.drawImage(image, x - width / 2, y - height / 2, width, height);
    ctx.restore();
  }

  function drawPlayer(player) {
    const alpha = player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0 ? .35 : 1;
    drawShadow('playerWingShadow', player.x, player.y + 36, 74, 22, alpha);
    if (game.activeWeapon === 'laser' && game.weaponLevels.laser > 0) {
      drawAsset('playerLaser', player.x, player.y - 12, 93, 68, 0, alpha);
    } else if (game.activeWeapon === 'homing' && game.weaponLevels.homing > 0) {
      drawAsset('playerMissile', player.x, player.y - 8, 108, 79, 0, alpha);
    } else {
      drawAsset('player', player.x + 13, player.y, 116, 85, 0, alpha);
    }
    if (game.running && game.time % .09 < .06) {
      for (const gun of GameRules.playerGunAnchors()) {
        drawAsset('playerMuzzleFlashV2', player.x + gun.x, player.y + gun.y, 8, 8, 0, alpha);
      }
    }
  }

  function drawEagle(enemy) {
    const angle = enemy.phase === 'dive' ? Math.atan2(enemy.vy, enemy.vx) - Math.PI / 2 : Math.sin(enemy.age * 5) * .15;
    drawShadow('owlWingShadow', enemy.x, enemy.y + 34, 72, 22);
    drawAsset('owl', enemy.x, enemy.y, 112, 90, angle);
  }

  function drawDrone(enemy) { drawShadow('droneBodyShadow', enemy.x, enemy.y + 29, 68, 18); drawAsset('drone', enemy.x, enemy.y, 92, 108, Math.sin(enemy.age * 3) * .12); }
  function drawBat(enemy) { drawShadow('batWingShadow', enemy.x, enemy.y + 29, 76, 18); drawAsset('bat', enemy.x, enemy.y, 122, 95, Math.sin(enemy.age * 7) * .08); }
  function drawWizard(enemy) { drawShadow('wizardRobesShadow', enemy.x, enemy.y + 37, 78, 21); drawAsset('wizard', enemy.x, enemy.y, 110, 96, Math.sin(enemy.age * 3) * .04); }
  function drawBoss(boss) {
    const angle = boss.charging ? Math.atan2(boss.vy, boss.vx) - Math.PI / 2 : 0;
    const key = boss.variant === 'brown' ? 'orangeBoss' : 'blueBoss';
    drawShadow(boss.variant === 'brown' ? 'bossOrangeEngineShadow' : 'bossBlueThrusterShadow', boss.x, boss.y + 62, 170, 36);
    drawAsset(key, boss.x, boss.y, boss.variant === 'brown' ? 230 : 210, boss.variant === 'brown' ? 104 : 150, angle);
  }

  function drawProjectiles() {
    for (const bullet of game.bullets) {
      if(bullet.type==='homing'){
        drawAsset('missile', bullet.x, bullet.y, 58, 35, Math.atan2(bullet.vy, bullet.vx));
        const exhaustKey = `missileExhaust${String(Math.floor(game.time * 15) % 3 + 1).padStart(2, '0')}`;
        const smokeKey = `missileSmoke${String(Math.floor(game.time * 9) % 3 + 1).padStart(2, '0')}`;
        drawAsset(exhaustKey, bullet.x - bullet.vx / 18, bullet.y - bullet.vy / 18, 24, 31, Math.atan2(bullet.vy, bullet.vx) + Math.PI / 2, .82);
        drawAsset(smokeKey, bullet.x - bullet.vx / 10, bullet.y - bullet.vy / 10, 30, 20, Math.atan2(bullet.vy, bullet.vx), .46);
      } else {
        drawAsset('bulletTrail', bullet.x - bullet.vx / 26, bullet.y - bullet.vy / 26, 8, 26, Math.atan2(bullet.vy, bullet.vx) - Math.PI / 2, .6);
        drawAsset('bulletCore', bullet.x, bullet.y, 12, 25, Math.atan2(bullet.vy, bullet.vx) - Math.PI / 2);
      }
    }
    for (const shot of game.enemyBullets) {
      drawAsset(shot.visualKey || 'enemyBullet', shot.x, shot.y, shot.r * 2.8, shot.r * 2.8);
    }
    if (game.laserTarget) drawAsset('laser', game.laserTarget.x, game.laserTarget.y, 20, 20, 0, .36);
    if (game.laserFlash) {
      const flash = game.laserFlash;
      drawAsset('laser', flash.x + Math.cos(flash.rotation) * flash.length / 2, flash.y + Math.sin(flash.rotation) * flash.length / 2, flash.length, 34, flash.rotation, flash.life / flash.maxLife);
    }
  }

  function drawEffects() {
    for (const impact of game.impacts) drawAsset(impact.key, impact.x, impact.y, 42, 42, 0, impact.life / impact.maxLife);
    for(const p of game.particles){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ellipse(p.x,p.y,p.size,p.size,p.color);}ctx.globalAlpha=1;
    for (const effect of game.damageEffects) {
      ctx.globalAlpha = clamp(effect.life / effect.maxLife, 0, 1) * (effect.kind === 'fire' ? .95 : .58);
      if (effect.kind === 'fire') { ellipse(effect.x, effect.y, 7, 10, '#ff6b35'); ellipse(effect.x, effect.y + 2, 3, 5, '#ffe46e'); }
      else ellipse(effect.x, effect.y, 9, 7, '#516879');
    }
    ctx.globalAlpha = 1;
    ctx.textAlign='center';ctx.font='900 20px Arial';for(const f of game.floaters){ctx.globalAlpha=clamp(f.life/.8,0,1);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}ctx.globalAlpha=1;
  }

  function drawEnemyHealth(e) {
    if(e.type==='boss')return;const width=46;ctx.fillStyle='rgba(18,42,74,.7)';ctx.fillRect(e.x-width/2,e.y-e.r-18,width,6);ctx.fillStyle='#ff5868';ctx.fillRect(e.x-width/2,e.y-e.r-18,width*clamp(e.hp/e.maxHp,0,1),6);
  }

  function drawScene() {
    if (!game) return;
    ctx.save();
    if(game.shake){ctx.translate(random(-game.shake,game.shake),random(-game.shake,game.shake));}
    drawBackground();
    for(const enemy of game.enemies){
      if(enemy.type==='eagle')drawEagle(enemy);else if(enemy.type==='drone')drawDrone(enemy);else if(enemy.type==='bat')drawBat(enemy);else if(enemy.type==='wizard')drawWizard(enemy);else drawBoss(enemy);
      drawEnemyHealth(enemy);
    }
    drawProjectiles();
    drawPlayer(game.player);
    drawEffects();
    ctx.restore();
  }

  function updateHud() {
    if(!game)return;
    ui['hp-fill'].style.width=`${game.player.hp}%`;ui['hp-text'].textContent=Math.ceil(game.player.hp);
    ui['xp-fill'].style.width=`${Math.min(100,(game.xp/50)*100)}%`;ui['xp-text'].textContent=game.xp;
    ui['kill-text'].textContent=`${game.normalKills%10}/10`;
    const attackMaxed=game.attackLevel>=GameRules.maxAttackLevel();ui['upgrade-attack'].disabled=attackMaxed||game.xp<50;ui['attack-upgrade-copy'].textContent=attackMaxed?'攻击已满级':`攻击升级·50 · 当前 ${GameRules.bulletDamage(game.attackLevel)}`;
    for(const type of ['homing','laser']){
      const fragmentButton=ui[`${type}-fragment`];fragmentButton.querySelector('.fragment-count').textContent=`${game.fragments[type]}/5`;fragmentButton.classList.toggle('ready',GameRules.canUpgrade(game.fragments[type],game.weaponLevels[type],type));
      const weaponButton=ui[`${type}-weapon`];const level=game.weaponLevels[type];weaponButton.querySelector('small').textContent=`Lv.${level}`;weaponButton.classList.toggle('locked',level===0);weaponButton.classList.toggle('active',game.activeWeapon===type);
    }
    if(game.boss){ui['boss-fill'].style.width=`${Math.max(0,game.boss.hp/game.boss.maxHp*100)}%`;}
  }

  function upgradeAttack() {
    const result=GameRules.applyAttackUpgrade(game.xp,game.attackLevel);if(!result.upgraded)return;
    game.xp=result.xp;game.attackLevel=result.level;playSound('upgrade');showToast(`双列火球伤害提升为 ${GameRules.bulletDamage(game.attackLevel)}！`);updateHud();
  }

  function openUpgrade(type) {
    if(!GameRules.canUpgrade(game.fragments[type],game.weaponLevels[type],type))return;
    modalWeapon=type;game.paused=true;ui['upgrade-modal'].classList.remove('hidden');
    const name=type==='homing'?'追踪弹':'激光枪';const next=game.weaponLevels[type]+1;
    ui['upgrade-title'].textContent=`${name} 可升到 Lv.${next}`;
        ui['upgrade-copy'].textContent=type==='homing'?`升级后每枚自动追踪弹造成 ${GameRules.specialDamage(type,next)} 伤害。`:`升级后激光每 1.5 秒造成 ${GameRules.specialDamage(type,next)} 伤害。`;
  }

  function acceptUpgrade() {
    if(!modalWeapon)return;const result=GameRules.applyFragmentUpgrade(game.fragments[modalWeapon],game.weaponLevels[modalWeapon],true,modalWeapon);if(!result.upgraded&&result.level===game.weaponLevels[modalWeapon])return;
    game.fragments[modalWeapon]=result.fragments;game.weaponLevels[modalWeapon]=result.level;if(!game.activeWeapon)game.activeWeapon=modalWeapon;
    playSound('upgrade');showToast(`${modalWeapon==='homing'?'追踪弹':'激光枪'}升到 Lv.${result.level}！`);closeUpgrade();
  }

  function closeUpgrade(){modalWeapon=null;game.paused=false;ui['upgrade-modal'].classList.add('hidden');updateHud();lastTime=performance.now();}
  function setSpecialWeapon(type){if(game.weaponLevels[type]<=0)return;const changed=game.activeWeapon!==type;game.activeWeapon=type;game.specialTimer=0;game.laserTimer=0;game.laserTargetId=null;if(changed)playSound('weapon-switch');showToast(type==='homing'?'已切换追踪弹':'已切换激光枪');updateHud();}

  function endGame(){
    if(!game.running)return;game.running=false;game.paused=false;
    playSound('game-over');
    ui['result-monsters'].textContent=game.normalKills;ui['result-bosses'].textContent=game.bosses;ui['result-damage'].textContent=GameRules.bulletDamage(game.attackLevel);
    ui['game-over'].classList.remove('hidden');
  }

  function loop(now){const dt=Math.min(.033,(now-lastTime)/1000);lastTime=now;update(dt);drawScene();requestAnimationFrame(loop);}

  shell.addEventListener('pointermove',event=>{if(!game?.running||game.paused)return;const rect=canvas.getBoundingClientRect();const point=GameRules.clampPoint((event.clientX-rect.left)/rect.width*W,(event.clientY-rect.top)/rect.height*H,W,H,105);game.player.x=point.x;game.player.y=point.y;game.player.tx=point.x;game.player.ty=point.y;game.player.hasTarget=true;});
  shell.addEventListener('pointerleave',()=>{if(game)game.player.hasTarget=false;});
  ui['start-button'].addEventListener('click',startGame);ui['restart-button'].addEventListener('click',startGame);ui['upgrade-attack'].addEventListener('click',upgradeAttack);
  ui['homing-fragment'].addEventListener('click',()=>openUpgrade('homing'));ui['laser-fragment'].addEventListener('click',()=>openUpgrade('laser'));
  ui['homing-weapon'].addEventListener('click',()=>setSpecialWeapon('homing'));ui['laser-weapon'].addEventListener('click',()=>setSpecialWeapon('laser'));
  ui['accept-upgrade'].addEventListener('click',acceptUpgrade);ui['defer-upgrade'].addEventListener('click',closeUpgrade);
  document.querySelectorAll('[data-scene-theme]').forEach(button => button.addEventListener('click', () => setSceneTheme(button.dataset.sceneTheme)));

  buildSpriteCache();resetGame();preloadAssets();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
